<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>tigeRider ⚡</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Oswald', sans-serif;
      line-height: 1.6;
    }

    header {
      text-align: center;
      padding: 2rem 1rem;
      background: linear-gradient(135deg, #ff8c00, #e65c00, #000);
      position: relative;
      overflow: hidden;
    }

    .logo-svg {
      display: flex;
      justify-content: center;
      padding: 1.5rem 0;
    }

    .tagline {
      text-align: center;
      font-size: 1.2rem;
      color: #ffcc00;
      margin-top: -0.5rem;
      text-shadow: 0 0 6px rgba(0,0,0,0.5);
    }

    nav {
      background: #111;
      padding: 0.8rem;
    }

    nav ul {
      display: flex;
      justify-content: center;
      list-style: none;
      gap: 2rem;
    }

    nav a {
      color: #ffaa00;
      text-decoration: none;
      text-transform: uppercase;
      font-weight: bold;
      font-size: 1.1rem;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #fff;
      text-shadow: 0 0 8px #ff8c00;
    }

    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    section {
      margin: 3rem 0;
    }

    h2 {
      font-size: 2.2rem;
      color: #ffaa00;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #ff8c00;
      padding-bottom: 0.5rem;
      display: inline-block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1.5rem;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 15px rgba(255, 140, 0, 0.3);
      border-color: #ff8c00;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      background: #0a0a0a;
      color: #777;
      font-size: 0.9rem;
    }

      .logo-svg { padding: 1rem 0; }
      nav ul { gap: 1
